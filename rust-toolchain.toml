# Pins the Rust toolchain for the Cargo projects in this repo.
# rustup picks this up automatically when running cargo/rustc from any subdirectory.
#
# We pin the Vale rustc *fork* (github.com/Verdagon/rust, branch `per-instance-mir`), built
# locally and linked as the `rustc-fork` rustup toolchain:
#
#     git clone https://github.com/Verdagon/rust ~/rust
#     cd ~/rust && git checkout per-instance-mir && ./x build   # builds stage2 (~hours)
#     rustup toolchain link rustc-fork ~/rust/build/host/stage2
#     ln -sf ~/rust/build/aarch64-apple-darwin/stage0/bin/cargo \
#            ~/rust/build/host/stage2/bin/cargo                 # give it a cargo (no fallback)
#
# Why the fork rather than an upstream nightly:
# - The `rust_interop` feature links rustc internals via `#![feature(rustc_private)]`, and the
#   fork carries the interop patches (the `per_instance_mir` query + `fill_extra_modules`) that
#   upstream lacks. Building interop against it needs no `rustup component add rustc-dev` — the
#   fork's stage2 sysroot already ships the rustc_private libs and rust-src.
# - The standalone (non-interop) build compiles on the fork identically; the patches are inert
#   without a plugin installing the providers, so there is ONE rustc version for both binaries.
#
# Distribution (getting the fork onto CI / other machines cheaply) is not solved yet — for now
# every checkout builds + links it as above.
#
# No `components` line: a linked toolchain can't `rustup component add`, and the fork's stage2
# sysroot already provides rustc / cargo / rustdoc / rust-src. rust-analyzer is not bundled;
# add it into the fork sysroot if Guardian's rust-analyzer-backed shields are re-enabled.
[toolchain]
channel = "rustc-fork"
