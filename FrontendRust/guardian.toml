shields_dirs = ["../Luz/shields", "docs/shields"]
backend = "claude"
port = 7878
exclude_shields = [
    "AvoidIfMatchesInTestsIfPossible-AIMITIPX.md",
    "BaseDirPathDiscipline-BDPDX.md",
    "DocumentPublicAPIs-DPAPIX.md",
    "ExtractMagicNumbersIntoNamedConstants-EMNINCX.md",
    "IntegrationTestsBehaveLikeUsers-ITBLUX.md",
    "DontConvenientlyChangeRequirements-DCCRX.md", # would be good as follower
    "ExplicitArgumentsNoOptionalOrDefaultedValues-EANODVX.md",
    "NeverRecoverAlwaysFail-NRAFX.md", # add some filters for this... can train async in review
    "FailFastFailLoud-FFFLX.md", # add some filters for this... can train async in review


    # To triage

    "NoStringlyTypedData-NSTDX.md",
    "EliminateAllWarnings-EAWX.md",
    "ErrorsMustCarryTheirLogFilePath-EMCTLFPX.md",
    "NeverLoseErrorInformation-NLEIX.md",
    "NeverSummarizeAwayErrorContent-NSAECX.md",
    "NoDroppedLocalVariablesOrCaptures-NDLVOCX.md",
    "PreferResultOverPanicForRecoverableCases-PROPRCX.md",

    "OutputAndLoggingZenDiscipline-OALZDX.md",
    "TypesFitIntoTheseCategories-TFITCX.md",

    # Retired — replaced by VRBX's strict Python script content gate (any mutating
    # Python invocation already fails to auto-allow and falls through to the
    # normal Bash confirmation prompt; PSMX's hard-deny added no meaningful
    # coverage under Guardian's any-approves model).
    "PythonScriptMutation-PSMX.md",

    # Retired — the "silently return a default" failure mode is rare in the
    # current codebase and the LLM shield produced too many false positives to
    # be worth the tokens.
    "TodosAndUnimplementedCodeMustPanic-TUCMPX.md",

    # Retired — the "is this type interned?" semantic check needs LLM judgment
    # and the false-positive rate was too high in practice to be worth running
    # at hook time.
    "ImmediateInterningDiscipline-IIDX.md",

    # Scala migration-era shields — no longer applicable now that the migration
    # is done, but the .md files still live in Luz/shields/ (deleting them is a
    # separate cleanup). Acknowledged here so Guardian's shield-coverage check
    # passes at startup.
    "MigrateAllCommentsToo-MACTX.md",
    "NoChangesWithoutScalaReference-NCWSRX.md",
    "ScalaSealedTraitsToRustEnums-SSTREX.md",
    "NoNewDefinitions-NNDX.md",
    "NoRenamedDefinitions-NRDX.md",
    "NoMovedDefinitions-NMDX.md",
]

[guard_mode]
include_shields = [
    { name = "NoGlobalStateAnywhere-NGSAX.md" },
    { name = "NoAddingGuardianDirectives-NAGDX.md" },
    { name = "NoRemovingVMarkers-NRVMX.md" },
    { name = "RequireSkillBeforeEdit-RSBEX.md" },

    { name = "NeverDowncastTraits-NEDCX.md" },
    { name = "NoModificationsToShieldFiles-NMSFX.md" },
    { name = "NeverUseStaticLifetime-NUSLX.md" },
    { name = "UseUseForShortNamesNotCrateInBodies-UUSNNCBX.md" },
    { name = "MultiLineValeFixtures-MLVFX.md" },
    { name = "AllowedFileExtensionsOnly-AFEOX.md" },

    { name = "ValidateReadonlyBash-VRBX.md" },
    { name = "BulkEditScriptWorkflow-BESWX.md" },
    { name = "MailboxWorkflow-MBXX.md" },

    { name = "MailboxWatcherGuard-MWGX.md" },
    { name = "WorkInProgressBranch-WIPBX.md" }
]

[review_mode]
include_shields = [
    { name = "ArenaAllocatedStructsShouldNotContainMallocdCollections-AASSNCMCX.md" },
    { name = "NoExpensiveClones-NECX.md" },
    { name = "SuffixWhenDealingWithMultipleStages-SWDWMSX.md" },
    { name = "EnumsShouldntContainComplexData-ESCCDX.md" },
    { name = "NeverRecoverAlwaysFail-NRAFX.md" },
    { name = "NoGlobalStateAnywhere-NGSAX.md" },
    { name = "FailFastFailLoud-FFFLX.md" },
    { name = "KeepInlineComparisonsInline-KICIX.md" },
    { name = "NeverHaveConditionalsInTests-NHCITX.md" },
    { name = "UseUseForShortNamesNotCrateInBodies-UUSNNCBX.md" },
    { name = "NeverRepeatImplementationCodeInTests-NRICITX.md" },
    { name = "NoConditionalsInTestsOneBranchProceedsAllOthersPanic-NCTOBPAOPX.md" },
    { name = "TestsPreferUnwrapToExpectForConciseness-TPUTEFCX.md" },
    { name = "PreferSingleMatchOverNestedMatches-PSMONMX.md" },
    { name = "ArenaTypesDontClone-ATDCX.md" },
    { name = "UseExpectFunctionsInsteadOfAssertingSizeThenIndexing-UEFIAIX.md" },
    { name = "NoModificationsToShieldFiles-NMSFX.md" },
    { name = "NeverUseStaticLifetime-NUSLX.md" },
    { name = "NoRemovingVMarkers-NRVMX.md" },

    { name = "ValidateReadonlyBash-VRBX.md" },
    { name = "BulkEditScriptWorkflow-BESWX.md" },
    { name = "MailboxWorkflow-MBXX.md" },
]
